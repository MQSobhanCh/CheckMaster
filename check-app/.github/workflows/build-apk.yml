name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # lets you also run it manually from the Actions tab

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17 (required by Capacitor 6 / Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      # Creates the native android/ project (only if it isn't already in the repo)
      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # Reads the images in assets/ and writes the custom launcher icon + splash
      # into the android/ project, replacing Capacitor's default blue logo
      - name: Generate app icon and splash screen
        run: npx capacitor-assets generate --android

      - name: Sync web build into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CheckMaster-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
