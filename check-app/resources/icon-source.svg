<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0f0d"/>
      <stop offset="1" stop-color="#052e22"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1" >
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e5e7eb"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect x="34" y="34" width="956" height="956" rx="196" fill="none" stroke="#10b981" stroke-opacity="0.35" stroke-width="10"/>

  <!-- cheque card -->
  <g transform="translate(212,300)">
    <rect width="600" height="400" rx="40" fill="url(#card)"/>
    <rect x="60" y="80" width="300" height="28" rx="14" fill="#9ca3af"/>
    <rect x="60" y="150" width="220" height="24" rx="12" fill="#cbd5e1"/>
    <rect x="60" y="290" width="160" height="40" rx="10" fill="#d1d5db"/>
  </g>

  <!-- emerald check badge -->
  <g transform="translate(612,470)">
    <circle cx="150" cy="150" r="150" fill="#10b981"/>
    <path d="M85 150 L130 198 L220 100" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
