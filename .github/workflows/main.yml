name: CheckMaster Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build CheckMaster APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: check-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Show project files
        run: |
          echo "Project files:"
          ls -la
          echo "Checking package.json..."
          test -f package.json

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Prepare Android
        run: |
          npm install @capacitor/android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CheckMaster-APK
          path: check-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
