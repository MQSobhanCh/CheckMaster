name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Android permissions, notification icon and version
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml

          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$MANIFEST"
          fi

          mkdir -p android/app/src/main/res/drawable
          cp resources/notification-icon/ic_stat_icon.png android/app/src/main/res/drawable/ic_stat_icon.png

          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Generate app icon and splash screen
        run: npx capacitor-assets generate --android

      - name: Sync web build into Android project
        run: npx cap sync android

      - name: Use fixed debug signing key
        run: |
          mkdir -p ~/.android
          cp .github/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CheckMaster-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APK
        if: env.SIGNING_KEY != ''
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign release APK
        if: env.SIGNING_KEY != ''
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload release APK
        if: env.SIGNING_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: CheckMaster-release-apk
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
